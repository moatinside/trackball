<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎱 TrackBall Trainer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#e6edf3;--text2:#8b949e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .4s ease;z-index:1}
.screen.active{opacity:1;pointer-events:auto;z-index:10}
.menu-container{width:100%;max-width:720px;padding:20px}
.menu-header{text-align:center;margin-bottom:36px}
.menu-header h1{font-size:2.4rem;margin-bottom:8px;background:linear-gradient(135deg,#4fc3f7,#66bb6a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{color:var(--text2);font-size:.95rem}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode-card{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:18px;cursor:pointer;text-align:left;color:var(--text);transition:all .2s ease;position:relative;font-family:inherit}
.mode-card:hover{background:var(--bg3);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.mode-icon{font-size:1.8rem;display:block;margin-bottom:6px}
.mode-info h3{font-size:1.05rem;margin-bottom:4px}
.mode-info p{font-size:.82rem;color:var(--text2);line-height:1.4;margin-bottom:6px}
.mode-skill{display:inline-block;font-size:.72rem;color:var(--accent);background:rgba(255,255,255,.05);padding:2px 8px;border-radius:4px}
.mode-best{position:absolute;top:10px;right:14px;font-size:.72rem;color:var(--text2)}
#game-screen{background:var(--bg)}
#game-hud{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;background:var(--bg2);border-bottom:1px solid var(--border);height:44px;width:100%;z-index:20;flex-shrink:0}
#back-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:.82rem;font-family:inherit}
#back-btn:hover{color:var(--text);border-color:var(--text2)}
#mode-label{font-size:.88rem;color:var(--text2)}
#score-display{font-size:1.15rem;font-weight:bold;font-variant-numeric:tabular-nums}
#timer-display{font-size:1.15rem;font-weight:bold;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
#game-canvas{flex:1;width:100%;display:block;cursor:none}
#countdown-overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,17,23,.88);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s ease}
#countdown-overlay.active{opacity:1;pointer-events:auto}
#countdown-text{font-size:5.5rem;font-weight:bold}
#countdown-instruction{font-size:1.05rem;color:var(--text2);margin-top:16px}
.result-container{text-align:center;padding:40px;max-width:480px}
.rank{font-size:5rem;font-weight:bold;margin-bottom:8px;text-shadow:0 0 40px currentColor}
.rank-S{color:#ffd700}.rank-A{color:#4fc3f7}.rank-B{color:#66bb6a}.rank-C{color:#ffa726}.rank-D{color:#8b949e}
.result-score{font-size:2.8rem;font-weight:bold}
.result-label{font-size:.88rem;color:var(--text2);margin-bottom:28px}
#result-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.detail-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px}
.detail-item .label{font-size:.78rem;color:var(--text2);margin-bottom:3px}
.detail-item .value{font-size:1.2rem;font-weight:bold}
.result-buttons{display:flex;gap:12px;justify-content:center}
.btn{padding:11px 24px;border-radius:8px;font-size:.95rem;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.btn-primary{background:#4fc3f7;color:#0d1117;font-weight:bold}
.btn-primary:hover{background:#81d4fa}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
.new-record{color:#ffd700;font-size:.85rem;margin-top:8px;margin-bottom:12px}
@media(max-width:600px){.mode-grid{grid-template-columns:1fr}.menu-header h1{font-size:1.8rem}}
</style>
</head>
<body>

<div id="menu-screen" class="screen active">
  <div class="menu-container">
    <div class="menu-header">
      <h1>🎱 TrackBall Trainer</h1>
      <p class="subtitle">トラックボール初心者のための指ならしゲーム</p>
    </div>
    <div class="mode-grid">
      <button class="mode-card" data-mode="bubble" style="--accent:#4fc3f7">
        <span class="mode-icon">🫧</span>
        <div class="mode-info">
          <h3>バブルポップ</h3>
          <p>出現するバブルをクリックして消そう</p>
          <span class="mode-skill">クリック精度</span>
        </div>
        <span class="mode-best" id="best-bubble"></span>
      </button>
      <button class="mode-card" data-mode="path" style="--accent:#66bb6a">
        <span class="mode-icon">〰️</span>
        <div class="mode-info">
          <h3>パストレース</h3>
          <p>ガイドの光を追いかけよう</p>
          <span class="mode-skill">滑らかな制御</span>
        </div>
        <span class="mode-best" id="best-path"></span>
      </button>
      <button class="mode-card" data-mode="tracking" style="--accent:#ffa726">
        <span class="mode-icon">🎯</span>
        <div class="mode-info">
          <h3>トラッキング</h3>
          <p>動くターゲットにカーソルを合わせ続けよう</p>
          <span class="mode-skill">追従力</span>
        </div>
        <span class="mode-best" id="best-tracking"></span>
      </button>
      <button class="mode-card" data-mode="flick" style="--accent:#ef5350">
        <span class="mode-icon">⚡</span>
        <div class="mode-info">
          <h3>フリック＆ストップ</h3>
          <p>離れたターゲットを素早く正確にクリック</p>
          <span class="mode-skill">大移動＋精密停止</span>
        </div>
        <span class="mode-best" id="best-flick"></span>
      </button>
    </div>
  </div>
</div>

<div id="game-screen" class="screen">
  <div id="game-hud">
    <button id="back-btn">← 戻る</button>
    <span id="mode-label"></span>
    <span id="score-display">0</span>
    <span id="timer-display">30.0</span>
  </div>
  <canvas id="game-canvas"></canvas>
  <div id="countdown-overlay">
    <div id="countdown-text">3</div>
    <div id="countdown-instruction"></div>
  </div>
</div>

<div id="result-screen" class="screen">
  <div class="result-container">
    <div class="rank" id="result-rank">A</div>
    <div class="result-score" id="result-score">0</div>
    <div class="result-label">SCORE</div>
    <div id="new-record" class="new-record" style="display:none">🏆 NEW RECORD!</div>
    <div id="result-details"></div>
    <div class="result-buttons">
      <button class="btn btn-primary" id="retry-btn">もう一度</button>
      <button class="btn btn-secondary" id="menu-btn">メニューに戻る</button>
    </div>
  </div>
</div>

<script>
// ===== AUDIO =====
const audio = {
  ctx: null,
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)() },
  play(freq, dur, type='sine', vol=0.12) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + dur);
  },
  pop() { this.play(800, 0.1); this.play(1200, 0.06, 'sine', 0.06) },
  hit() { this.play(900, 0.08) },
  miss() { this.play(200, 0.12, 'triangle', 0.08) },
  countdown() { this.play(440, 0.12) },
  go() { this.play(880, 0.18) },
  complete() { this.play(523, 0.15); setTimeout(() => this.play(659, 0.15), 150); setTimeout(() => this.play(784, 0.25), 300) }
};

// ===== PARTICLES & FLOATING TEXT =====
const particles = [];
const floatingTexts = [];

function addParticles(x, y, color, count=10) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 120;
    const life = 0.3 + Math.random() * 0.5;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life, maxLife: life, size: 2+Math.random()*3, color });
  }
}
function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 150*dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function renderParticles(ctx) {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life/p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*(p.life/p.maxLife), 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}
function addFloatingText(x, y, text, color='#fff') {
  floatingTexts.push({ x, y, text, color, opacity:1, vy:-60, life:1 });
}
function updateFloatingTexts(dt) {
  for (let i = floatingTexts.length-1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y += t.vy*dt; t.life -= dt*1.5; t.opacity = Math.max(0, t.life);
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
}
function renderFloatingTexts(ctx) {
  ctx.textAlign = 'center';
  floatingTexts.forEach(t => {
    ctx.globalAlpha = t.opacity; ctx.fillStyle = t.color;
    ctx.font = 'bold 16px sans-serif'; ctx.fillText(t.text, t.x, t.y);
  });
  ctx.globalAlpha = 1;
}

// ===== GAME STATE =====
const game = { state:'menu', mode:null, canvas:null, ctx:null, width:0, height:0, mouseX:0, mouseY:0, score:0, timeLeft:0, duration:30, lastTime:0, animId:null, countdownId:null };

const MODE_NAMES = { bubble:'バブルポップ', path:'パストレース', tracking:'トラッキング', flick:'フリック＆ストップ' };
const MODE_INSTRUCTIONS = { bubble:'バブルをクリックして消そう！', path:'ガイドの光を追いかけよう！', tracking:'ターゲットにカーソルを合わせ続けよう！', flick:'ターゲットを素早く正確にクリック！' };

// ===== CANVAS =====
function setupCanvas() {
  const canvas = document.getElementById('game-canvas');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  game.canvas = canvas; game.ctx = ctx; game.width = rect.width; game.height = rect.height;
}

// ===== MODES =====

// --- Bubble Pop ---
const bubbleMode = {
  bubbles: [], spawnTimer: 0, spawnInterval: 1.0,
  stats: { hits:0, misses:0, clicks:0, totalReaction:0 },
  init() {
    this.bubbles = []; this.spawnTimer = 0; this.spawnInterval = 1.0;
    this.stats = { hits:0, misses:0, clicks:0, totalReaction:0 };
    this.spawn();
  },
  spawn() {
    const m = 60, r = 18 + Math.random()*35;
    this.bubbles.push({
      x: m + Math.random()*(game.width-m*2), y: m + Math.random()*(game.height-m*2),
      radius: r, maxRadius: r, lifetime: 3200, born: performance.now(),
      hue: Math.random()*360, opacity: 1
    });
  },
  update(dt) {
    this.spawnTimer += dt;
    if (this.spawnTimer >= this.spawnInterval && this.bubbles.length < 6) {
      this.spawn(); this.spawnTimer = 0;
      this.spawnInterval = Math.max(0.35, this.spawnInterval - 0.015);
    }
    const now = performance.now();
    for (let i = this.bubbles.length-1; i >= 0; i--) {
      const b = this.bubbles[i], age = now - b.born, prog = age / b.lifetime;
      b.radius = b.maxRadius * (1 - prog*0.5); b
