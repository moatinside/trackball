<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎱 TrackBall Trainer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#e6edf3;--text2:#8b949e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none}

/* --- screens --- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:1}
.screen.active{display:flex;z-index:10}
.screen-center{align-items:center;justify-content:center}

/* --- menu --- */
.menu-container{width:100%;max-width:720px;padding:20px}
.menu-header{text-align:center;margin-bottom:36px}
.menu-header h1{font-size:2.4rem;margin-bottom:8px;background:linear-gradient(135deg,#4fc3f7,#66bb6a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{color:var(--text2);font-size:.95rem}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode-card{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:18px;cursor:pointer;text-align:left;color:var(--text);transition:all .2s ease;position:relative;font-family:inherit}
.mode-card:hover{background:var(--bg3);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.mode-icon{font-size:1.8rem;display:block;margin-bottom:6px}
.mode-info h3{font-size:1.05rem;margin-bottom:4px}
.mode-info p{font-size:.82rem;color:var(--text2);line-height:1.4;margin-bottom:6px}
.mode-skill{display:inline-block;font-size:.72rem;color:var(--accent);background:rgba(255,255,255,.05);padding:2px 8px;border-radius:4px}
.mode-best{position:absolute;top:10px;right:14px;font-size:.72rem;color:var(--text2)}

/* --- game --- */
#game-hud{display:flex;align-items:center;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border);height:44px;width:100%;flex-shrink:0;gap:12px}
#back-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:.82rem;font-family:inherit}
#back-btn:hover{color:var(--text);border-color:var(--text2)}
#mode-label{font-size:.88rem;color:var(--text2);flex:1;text-align:center}
#score-display{font-size:1.15rem;font-weight:bold;font-variant-numeric:tabular-nums}
#timer-display{font-size:1.15rem;font-weight:bold;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
#canvas-wrap{flex:1;position:relative;overflow:hidden}
#game-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:none}

/* --- countdown --- */
#countdown-overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,17,23,.88);z-index:30;pointer-events:none}
#countdown-overlay.hidden{display:none}
#countdown-text{font-size:5.5rem;font-weight:bold}
#countdown-instruction{font-size:1.05rem;color:var(--text2);margin-top:16px;text-align:center;padding:0 20px;white-space:pre-line}

/* --- result --- */
.result-container{text-align:center;padding:40px;max-width:480px}
.rank{font-size:5rem;font-weight:bold;margin-bottom:8px;text-shadow:0 0 40px currentColor}
.rank-S{color:#ffd700}.rank-A{color:#4fc3f7}.rank-B{color:#66bb6a}.rank-C{color:#ffa726}.rank-D{color:#8b949e}
.result-score{font-size:2.8rem;font-weight:bold}
.result-label{font-size:.88rem;color:var(--text2);margin-bottom:28px}
.new-record{color:#ffd700;font-size:.85rem;margin-top:8px;margin-bottom:12px}
#result-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.detail-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px}
.detail-item .label{font-size:.78rem;color:var(--text2);margin-bottom:3px}
.detail-item .value{font-size:1.2rem;font-weight:bold}
.result-buttons{display:flex;gap:12px;justify-content:center}
.btn{padding:11px 24px;border-radius:8px;font-size:.95rem;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.btn-primary{background:#4fc3f7;color:#0d1117;font-weight:bold}
.btn-primary:hover{background:#81d4fa}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
@media(max-width:600px){.mode-grid{grid-template-columns:1fr}.menu-header h1{font-size:1.8rem}}
</style>
</head>
<body>

<!-- ===== MENU ===== -->
<div id="menu-screen" class="screen screen-center active">
  <div class="menu-container">
    <div class="menu-header">
      <h1>🎱 TrackBall Trainer</h1>
      <p class="subtitle">トラックボール初心者のための指ならしゲーム</p>
    </div>
    <div class="mode-grid" id="mode-grid">
      <button class="mode-card" data-mode="bubble" style="--accent:#4fc3f7">
        <span class="mode-icon">🫧</span>
        <div class="mode-info"><h3>バブルポップ</h3><p>出現するバブルをクリックして消そう</p><span class="mode-skill">クリック精度</span></div>
        <span class="mode-best" id="best-bubble"></span>
      </button>
      <button class="mode-card" data-mode="path" style="--accent:#66bb6a">
        <span class="mode-icon">〰️</span>
        <div class="mode-info"><h3>パストレース</h3><p>ガイドの光を追いかけよう</p><span class="mode-skill">滑らかな制御</span></div>
        <span class="mode-best" id="best-path"></span>
      </button>
      <button class="mode-card" data-mode="tracking" style="--accent:#ffa726">
        <span class="mode-icon">🎯</span>
        <div class="mode-info"><h3>トラッキング</h3><p>動くターゲットにカーソルを合わせ続けよう</p><span class="mode-skill">追従力</span></div>
        <span class="mode-best" id="best-tracking"></span>
      </button>
      <button class="mode-card" data-mode="flick" style="--accent:#ef5350">
        <span class="mode-icon">⚡</span>
        <div class="mode-info"><h3>フリック＆ストップ</h3><p>離れたターゲットを素早く正確にクリック</p><span class="mode-skill">大移動＋精密停止</span></div>
        <span class="mode-best" id="best-flick"></span>
      </button>
    </div>
  </div>
</div>

<!-- ===== GAME ===== -->
<div id="game-screen" class="screen">
  <div id="game-hud">
    <button id="back-btn">← 戻る</button>
    <span id="mode-label"></span>
    <span id="score-display">0</span>
    <span id="timer-display">30.0</span>
  </div>
  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="countdown-overlay" class="hidden">
    <div id="countdown-text">3</div>
    <div id="countdown-instruction"></div>
  </div>
</div>

<!-- ===== RESULT ===== -->
<div id="result-screen" class="screen screen-center">
  <div class="result-container">
    <div class="rank" id="result-rank">A</div>
    <div class="result-score" id="result-score">0</div>
    <div class="result-label">SCORE</div>
    <div id="new-record" class="new-record" style="display:none">🏆 NEW RECORD!</div>
    <div id="result-details"></div>
    <div class="result-buttons">
      <button class="btn btn-primary" id="retry-btn">もう一度</button>
      <button class="btn btn-secondary" id="menu-btn">メニューに戻る</button>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  /* ========================================
     AUDIO
     ======================================== */
  var audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  function playTone(freq, dur, type, vol) {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol != null ? vol : 0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }
  function sfxPop()       { playTone(800,0.1); playTone(1200,0.06,'sine',0.05); }
  function sfxMiss()      { playTone(200,0.12,'triangle',0.08); }
  function sfxCountdown() { playTone(440,0.12); }
  function sfxGo()        { playTone(880,0.18); }
  function sfxComplete()  { playTone(523,0.15); setTimeout(function(){playTone(659,0.15)},150); setTimeout(function(){playTone(784,0.25)},300); }

  /* ========================================
     EFFECTS
     ======================================== */
  var particles = [];
  var texts = [];

  function spawnParticles(x, y, color, n) {
    for (var i = 0; i < (n||10); i++) {
      var a = Math.random()*Math.PI*2, spd = 50+Math.random()*100;
      var life = 0.3+Math.random()*0.4;
      particles.push({x:x,y:y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:life,max:life,sz:2+Math.random()*3,col:color});
    }
  }
  function spawnText(x, y, str, color) {
    texts.push({x:x,y:y,str:str,col:color||'#fff',life:1});
  }
  function tickEffects(dt) {
    var i;
    for (i = particles.length-1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 120*dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i,1);
    }
    for (i = texts.length-1; i >= 0; i--) {
      var t = texts[i];
      t.y -= 50*dt; t.life -= dt*1.4;
      if (t.life <= 0) texts.splice(i,1);
    }
  }
  function drawEffects(c) {
    var i;
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      c.globalAlpha = Math.max(0, p.life/p.max);
      c.fillStyle = p.col;
      c.beginPath(); c.arc(p.x,p.y,p.sz*(p.life/p.max),0,Math.PI*2); c.fill();
    }
    c.font = 'bold 15px sans-serif'; c.textAlign = 'center';
    for (i = 0; i < texts.length; i++) {
      var t = texts[i];
      c.globalAlpha = Math.max(0, t.life);
      c.fillStyle = t.col;
      c.fillText(t.str, t.x, t.y);
    }
    c.globalAlpha = 1;
  }

  /* ========================================
     GLOBALS
     ======================================== */
  var canvas = document.getElementById('game-canvas');
  var cx = canvas.getContext('2d');
  var W = 0, H = 0;
  var mx = 0, my = 0;
  var score = 0, timeLeft = 0, DURATION = 30;
  var running = false, currentMode = null, animId = null, lastT = 0;
  var countdownTimer = null;

  var NAMES = {bubble:'バブルポップ',path:'パストレース',tracking:'トラッキング',flick:'フリック＆ストップ'};
  var HINTS = {bubble:'バブルをクリックして消そう！',path:'ガイドの光をカーソルで追いかけよう！\nクリック不要',tracking:'ターゲットにカーソルを合わせ続けよう！\nクリック不要',flick:'赤いターゲットを素早くクリック！'};

  function resize() {
    var wrap = document.getElementById('canvas-wrap');
    var r = wrap.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = r.width * dpr;
    canvas.height = r.height * dpr;
    canvas.style.width = r.width + 'px';
    canvas.style.height = r.height + 'px';
    cx.setTransform(dpr,0,0,dpr,0,0);
    W = r.width; H = r.height;
  }

  function drawCursor(c) {
    c.strokeStyle='#fff'; c.lineWidth=2;
    c.beginPath();
    c.moveTo(mx-12,my); c.lineTo(mx-5,my);
    c.moveTo(mx+5,my);  c.lineTo(mx+12,my);
    c.moveTo(mx,my-12); c.lineTo(mx,my-5);
    c.moveTo(mx,my+5);  c.lineTo(mx,my+12);
    c.stroke();
  }

  function drawBg(c) {
    c.strokeStyle='rgba(255,255,255,0.03)'; c.lineWidth=1;
    for (var x=0;x<W;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
    for (var y=0;y<H;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
  }

  /* ========================================
     MODE: BUBBLE POP
     ======================================== */
  var bubbles = [];
  var bTimer = 0, bInterval = 0, bCombo = 0, bMaxCombo = 0;
  var bHits = 0, bMiss = 0, bClicks = 0;

  function bubbleInit() {
    bubbles = []; bTimer = 0; bInterval = 1; bCombo = 0; bMaxCombo = 0;
    bHits = 0; bMiss = 0; bClicks = 0;
    bubbleSpawn();
  }
  function bubbleSpawn() {
    var m = 60, r = 18+Math.random()*30;
    bubbles.push({x:m+Math.random()*(W-m*2), y:m+Math.random()*(H-m*2), r:r, mr:r, age:0, ma:3.5, hue:Math.random()*360});
  }
  function bubbleUpdate(dt) {
    bTimer += dt;
    if (bTimer >= bInterval && bubbles.length < 6) { bubbleSpawn(); bTimer=0; bInterval=Math.max(0.35,bInterval-0.02); }
    for (var i=bubbles.length-1; i>=0; i--) {
      var b = bubbles[i]; b.age += dt; b.r = b.mr*(1-(b.age/b.ma)*0.4);
      if (b.age >= b.ma) { bubbles.splice(i,1); bMiss++; bCombo=0; sfxMiss(); }
    }
  }
  function bubbleClick(x, y) {
    bClicks++;
    for (var i=bubbles.length-1; i>=0; i--) {
      var b=bubbles[i], dx=x-b.x, dy=y-b.y;
      if (dx*dx+dy*dy <= b.r*b.r) {
        bCombo++; if(bCombo>bMaxCombo) bMaxCombo=bCombo;
        var pts=Math.round(10*(b.mr/48)+bCombo*2); score+=pts; bHits++;
        spawnParticles(b.x,b.y,'hsl('+b.hue+',70%,60%)',12);
        spawnText(b.x,b.y-b.r-10,'+'+pts,'hsl('+b.hue+',80%,70%)');
        if(bCombo>=3) spawnText(b.x,b.y-b.r-30,bCombo+' combo!','#ffd700');
        bubbles.splice(i,1); sfxPop(); return;
      }
    }
    bCombo=0;
  }
  function bubbleRender(c) {
    for (var i=0; i<bubbles.length; i++) {
      var b=bubbles[i], p=b.age/b.ma;
      c.globalAlpha=1-p*0.5;
      var g=c.createRadialGradient(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.1,b.x,b.y,b.r);
      g.addColorStop(0,'hsla('+b.hue+',80%,75%,.9)'); g.addColorStop(1,'hsla('+b.hue+',70%,50%,.6)');
      c.fillStyle=g; c.beginPath(); c.arc(b.x,b.y,b.r,0,Math.PI*2); c.fill();
      c.strokeStyle='hsla('+b.hue+',70%,80%,.4)'; c.lineWidth=2; c.stroke();
      c.globalAlpha=0.4; c.strokeStyle=p>0.7?'#ef5350':'#666'; c.lineWidth=3;
      c.beginPath(); c.arc(b.x,b.y,b.r+5,-Math.PI/2,-Math.PI/2+(1-p)*Math.PI*2); c.stroke();
      c.globalAlpha=1;
    }
  }
  function bubbleDetails() {
    var acc=bClicks>0?Math.round(bHits/bClicks*100):0;
    return [{l:'命中',v:bHits},{l:'精度',v:acc+'%'},{l:'最大コンボ',v:bMaxCombo},{l:'消失',v:bMiss}];
  }

  /* ========================================
     MODE: PATH TRACE
     ======================================== */
  var pgx=0,pgy=0,pPts=[],pIdx=0,pSpd=0;
  var pTotalDist=0,pClose=0,pSamples=0,pTrail=[];

  function pathInit() {
    pSpd=100; pTotalDist=0; pClose=0; pSamples=0; pIdx=0; pPts=[]; pTrail=[];
    var cxx=W/2, cyy=H/2, n=8+Math.floor(Math.random()*4);
    var rx=Math.min(W*0.33,260), ry=Math.min(H*0.33,200);
    for (var i=0; i<n; i++) {
      var a=Math.PI*2*i/n;
      pPts.push({x:cxx+Math.cos(a)*rx*(0.6+Math.random()*0.4), y:cyy+Math.sin(a)*ry*(0.6+Math.random()*0.4)});
    }
    pgx=pPts[0].x; pgy=pPts[0].y;
  }
  function pathUpdate(dt) {
    var ni=(pIdx+1)%pPts.length, t=pPts[ni];
    var dx=t.x-pgx, dy=t.y-pgy, d=Math.sqrt(dx*dx+dy*dy);
    if (d<5) { pIdx=ni; pSpd=Math.min(240,pSpd+3); }
    else { var s=pSpd*dt; pgx+=dx/d*s; pgy+=dy/d*s; }
    pTrail.push({x:pgx,y:pgy}); if(pTrail.length>60) pTrail.shift();
    var md=Math.sqrt((mx-pgx)*(mx-pgx)+(my-pgy)*(my-pgy));
    pSamples++; pTotalDist+=md;
    if(md<50) pClose++;
    score += Math.max(0, Math.round((50-Math.min(md,50))*0.3));
  }
  function pathClick() {}
  function pathRender(c) {
    c.strokeStyle='rgba(102,187,106,0.12)'; c.lineWidth=2; c.setLineDash([6,6]);
    c.beginPath();
    for(var i=0;i<pPts.length;i++){i===0?c.moveTo(pPts[i].x,pPts[i].y):c.lineTo(pPts[i].x,pPts[i].y);}
    c.closePath(); c.stroke(); c.setLineDash([]);
    if(pTrail.length>1){
      c.strokeStyle='rgba(102,187,106,0.25)'; c.lineWidth=3; c.beginPath();
      c.moveTo(pTrail[0].x,pTrail[0].y);
      for(var i=1;i<pTrail.length;i++) c.lineTo(pTrail[i].x,pTrail[i].y);
      c.stroke();
    }
    c.save(); c.shadowColor='#66bb6a'; c.shadowBlur=20;
    c.fillStyle='#66bb6a'; c.beginPath(); c.arc(pgx,pgy,12,0,Math.PI*2); c.fill(); c.restore();
    c.fillStyle='#fff'; c.beginPath(); c.arc(pgx,pgy,4,0,Math.PI*2); c.fill();
    var md=Math.sqrt((mx-pgx)*(mx-pgx)+(my-pgy)*(my-pgy));
    c.strokeStyle=md<50?'rgba(102,187,106,0.3)':'rgba(239,83,80,0.2)'; c.lineWidth=1;
    c.beginPath(); c.arc(pgx,pgy,50,0,Math.PI*2); c.stroke();
    c.strokeStyle=md<50?'rgba(102,187,106,0.3)':'rgba(239,83,80,0.2)'; c.lineWidth=1;
    c.beginPath(); c.moveTo(mx,my); c.lineTo(pgx,pgy); c.stroke();
    c.fillStyle=md<50?'#66bb6a':'#ef5350'; c.font='12px sans-serif'; c.textAlign='center';
    c.fillText(Math.round(md)+'px',(mx+pgx)/2,(my+pgy)/2-8);
  }
  function pathDetails() {
    var avg=pSamples>0?Math.round(pTotalDist/pSamples):0;
    var pct=pSamples>0?Math.round(pClose/pSamples*100):0;
    return [{l:'平均距離',v:avg+'px'},{l:'範囲内率',v:pct+'%'},{l:'最終速度',v:Math.round(pSpd)},{l:'スコア',v:score}];
  }

  /* ========================================
     MODE: TRACKING
     ======================================== */
  var ttx=0,tty=0,ttvx=0,ttvy=0,tRadius=35;
  var tIn=0,tTotal=0,tDirChanges=0,tChangeTimer=0;

  function trackInit() {
    ttx=W/2; tty=H/2; tRadius=35; tIn=0; tTotal=0; tDirChanges=0; tChangeTimer=0;
    var a=Math.random()*Math.PI*2; ttvx=Math.cos(a)*80; ttvy=Math.sin(a)*80;
  }
  function trackUpdate(dt) {
    var m=50;
    ttx+=ttvx*dt; tty+=ttvy*dt;
    if(ttx<m){ttx=m;ttvx=Math.abs(ttvx);trackBounce();}
    if(ttx>W-m){ttx=W-m;ttvx=-Math.abs(ttvx);trackBounce();}
    if(tty<m){tty=m;ttvy=Math.abs(ttvy);trackBounce();}
    if(tty>H-m){tty=H-m;ttvy=-Math.abs(ttvy);trackBounce();}
    tChangeTimer+=dt;
    if(tChangeTimer>2+Math.random()*2){tChangeTimer=0;trackBounce();}
    var spd=Math.sqrt(ttvx*ttvx+ttvy*ttvy);
    if(spd<200){var f=1+dt*0.025;ttvx*=f;ttvy*=f;}
    tTotal+=dt;
    var dx=mx-ttx,dy=my-tty,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<=tRadius){tIn+=dt;score+=Math.round(dt*80);}
  }
  function trackBounce() {
    tDirChanges++;
    var spd=Math.sqrt(ttvx*ttvx+ttvy*ttvy);
    var a=Math.atan2(ttvy,ttvx)+(Math.random()-0.5)*Math.PI*0.7;
    ttvx=Math.cos(a)*spd; ttvy=Math.sin(a)*spd;
  }
  function trackClick() {}
  function trackRender(c) {
    var dx=mx-ttx,dy=my-tty,dist=Math.sqrt(dx*dx+dy*dy),ins=dist<=tRadius;
    c.strokeStyle=ins?'rgba(255,167,38,0.5)':'rgba(255,255,255,0.1)'; c.lineWidth=2;
    c.beginPath(); c.arc(ttx,tty,tRadius,0,Math.PI*2); c.stroke();
    var spd=Math.sqrt(ttvx*ttvx+ttvy*ttvy);
    if(spd>0){
      c.strokeStyle='rgba(255,255,255,0.06)'; c.lineWidth=1;
      c.beginPath(); c.moveTo(ttx,tty); c.lineTo(ttx+ttvx/spd*40,tty+ttvy/spd*40); c.stroke();
    }
    c.save(); c.shadowColor=ins?'#ffa726':'#ef5350'; c.shadowBlur=ins?30:12;
    c.fillStyle=ins?'#ffa726':'#ef5350'; c.beginPath(); c.arc(ttx,tty,10,0,Math.PI*2); c.fill(); c.restore();
    c.fillStyle='#fff'; c.beginPath(); c.arc(ttx,tty,3,0,Math.PI*2); c.fill();
    var pct=tTotal>0?Math.round(tIn/tTotal*100):0;
    var bw=120,bh=8,bx=W/2-bw/2,by=H-30;
    c.fillStyle='rgba(255,255,255,0.08)'; c.fillRect(bx,by,bw,bh);
    c.fillStyle=pct>60?'#66bb6a':pct>30?'#ffa726':'#ef5350'; c.fillRect(bx,by,bw*pct/100,bh);
    c.fillStyle='rgba(255,255,255,0.5)'; c.font='12px sans-serif'; c.textAlign='center';
    c.fillText('追従率 '+pct+'%',W/2,by-6);
  }
  function trackDetails() {
    var pct=tTotal>0?Math.round(tIn/tTotal*100):0;
    return [{l:'追従率',v:pct+'%'},{l:'追従時間',v:tIn.toFixed(1)+'s'},{l:'方向転換',v:tDirChanges},{l:'スコア',v:score}];
  }

  /* ========================================
     MODE: FLICK & STOP
     ======================================== */
  var ftx=0,fty=0,ftr=22,fBorn=0,fActive=false;
  var fPrevX=0,fPrevY=0;
  var fHits=0,fClicks=0,fTotalReact=0,fMinReact=99999;
  var fSpawnPending=false;

  function flickInit() {
    fHits=0;fClicks=0;fTotalReact=0;fMinReact=99999;
    fPrevX=W/2;fPrevY=H/2;fActive=false;fSpawnPending=false;
    flickSpawn();
  }
  function flickSpawn() {
    var m=70,x,y,att=0;
    do{x=m+Math.random()*(W-m*2);y=m+Math.random()*(H-m*2);att++;}
    while(att<50&&Math.sqrt((x-fPrevX)*(x-fPrevX)+(y-fPrevY)*(y-fPrevY))<Math.min(W,H)*0.3);
    ftx=x;fty=y;ftr=22;fBorn=performance.now();fActive=true;fSpawnPending=false;
  }
  function flickUpdate(dt) {}
  function flickClick(x, y) {
    if(!fActive) return;
    fClicks++;
    var dx=x-ftx,dy=y-fty,dist=Math.sqrt(dx*dx+dy*dy),hr=ftr*1.5;
    if(dist<=hr){
      var react=(performance.now()-fBorn)/1000;
      fHits++;fTotalReact+=react;if(react<fMinReact)fMinReact=react;
      var pts=Math.max(5,Math.round(120-react*40));
      pts+=Math.round((1-dist/hr)*30); score+=pts;
      spawnParticles(ftx,fty,'#ef5350',15);
      var lbl='+'+pts;if(react<0.4)lbl+=' ⚡';else if(react<0.7)lbl+=' ✨';
      spawnText(ftx,fty-35,lbl,'#ff8a65');
      sfxPop(); fPrevX=ftx;fPrevY=fty;fActive=false;
      if(!fSpawnPending){fSpawnPending=true;setTimeout(function(){if(running)flickSpawn();},250);}
    } else {
      sfxMiss(); spawnText(x,y-20,'MISS','#ef5350');
    }
  }
  function flickRender(c) {
    if(!fActive) return;
    var pulse=Math.sin(performance.now()*0.006)*0.15+1;
    var elapsed=(performance.now()-fBorn)/1000;
    c.strokeStyle='rgba(239,83,80,0.15)'; c.lineWidth=1;
    c.beginPath();
    c.moveTo(ftx-50,fty);c.lineTo(ftx-ftr-5,fty);
    c.moveTo(ftx+ftr+5,fty);c.lineTo(ftx+50,fty);
    c.moveTo(ftx,fty-50);c.lineTo(ftx,fty-ftr-5);
    c.moveTo(ftx,fty+ftr+5);c.lineTo(ftx,fty+50);
    c.stroke();
    c.strokeStyle='rgba(239,83,80,0.3)'; c.lineWidth=2;
    c.beginPath(); c.arc(ftx,fty,ftr*1.5,0,Math.PI*2); c.stroke();
    c.save(); c.shadowColor='#ef5350'; c.shadowBlur=25;
    c.fillStyle='#ef5350'; c.beginPath(); c.arc(ftx,fty,ftr*pulse,0,Math.PI*2); c.fill(); c.restore();
    c.fillStyle='#fff'; c.beginPath(); c.arc(ftx,fty,4,0,Math.PI*2); c.fill();
    c.fillStyle=elapsed>1.5?'#ef5350':'rgba(255,255,255,0.4)'; c.font='11px sans-serif'; c.textAlign='center';
    c.fillText(elapsed.toFixed(1)+'s',ftx,fty+ftr+18);
    c.strokeStyle='rgba(255,255,255,0.05)'; c.lineWidth=1; c.setLineDash([4,4]);
    c.beginPath(); c.moveTo(fPrevX,fPrevY); c.lineTo(ftx,fty); c.stroke(); c.setLineDash([]);
  }
  function flickDetails() {
    var avg=fHits>0?Math.round(fTotalReact/fHits*1000):0;
    var best=fMinReact<99999?Math.round(fMinReact*1000):0;
    var acc=fClicks>0?Math.round(fHits/fClicks*100):0;
    return [{l:'命中',v:fHits},{l:'精度',v:acc+'%'},{l:'平均反応',v:avg+'ms'},{l:'最速反応',v:best+'ms'}];
  }

  /* ========================================
     MODE DISPATCH TABLE
     ======================================== */
  var modes = {
    bubble:   {init:bubbleInit,   update:bubbleUpdate,  click:bubbleClick,  render:bubbleRender,  details:bubbleDetails},
    path:     {init:pathInit,     update:pathUpdate,     click:pathClick,    render:pathRender,    details:pathDetails},
    tracking: {init:trackInit,    update:trackUpdate,    click:trackClick,   render:trackRender,   details:trackDetails},
    flick:    {init:flickInit,    update:flickUpdate,    click:flickClick,   render:flickRender,   details:flickDetails}
  };

  /* ========================================
     SCREEN MANAGEMENT
     ======================================== */
  function showScreen(id) {
    var all = document.querySelectorAll('.screen');
    for (var i=0; i<all.length; i++) all[i].classList.remove('active');
    document.getElementById(id).classList.add('active');
  }

  function loadBests() {
    var ms = ['bubble','path','tracking','flick'];
    for (var i=0; i<ms.length; i++) {
      var b = localStorage.getItem('tb_best_'+ms[i]);
      var el = document.getElementById('best-'+ms[i]);
      if (b && el) el.textContent = 'BEST: '+b;
    }
  }

  /* ========================================
     GAME START / LOOP / END
     ======================================== */
  function startGame(mode) {
    initAudio();
    currentMode = mode;
    score = 0; timeLeft = DURATION; running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }

    showScreen('game-screen');
    document.getElementById('mode-label').textContent = NAMES[mode];
    document.getElementById('score-display').textContent = '0';
    document.getElementById('timer-display').textContent = DURATION.toFixed(1);

    particles.length = 0; texts.length = 0;

    // wait for layout
    setTimeout(function() {
      resize();
      doCountdown(mode);
    }, 50);
  }

  function doCountdown(mode) {
    var overlay = document.getElementById('countdown-overlay');
    var ctext = document.getElementById('countdown-text');
    var cinst = document.getElementById('countdown-instruction');
    cinst.textContent = HINTS[mode];
    overlay.classList.remove('hidden');

    var count = 3;
    ctext.textContent = count;
    sfxCountdown();

    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = setInterval(function() {
      count--;
      if (count > 0) { ctext.textContent = count; sfxCountdown(); }
      else {
        ctext.textContent = 'GO!'; sfxGo();
        clearInterval(countdownTimer); countdownTimer = null;
        setTimeout(function() {
          overlay.classList.add('hidden');
          modes[mode].init();
          running = true;
          lastT = performance.now();
          gameLoop();
        }, 400);
      }
    }, 800);
  }

  function gameLoop() {
    var now = performance.now();
    var dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;

    if (running) {
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; running = false; endGame(); return; }
      document.getElementById('timer-display').textContent = timeLeft.toFixed(1);
      document.getElementById('score-display').textContent = score;
      modes[currentMode].update(dt);
      tickEffects(dt);
    }

    cx.clearRect(0, 0, W, H);
    drawBg(cx);
    modes[currentMode].render(cx);
    drawEffects(cx);
    drawCursor(cx);

    if (running) animId = requestAnimationFrame(gameLoop);
  }

  function endGame() {
    sfxComplete();
    setTimeout(function() {
      var details = modes[currentMode].details();
      var thresholds = {bubble:[1500,1000,500,150],path:[2500,1500,800,300],tracking:[2200,1500,800,300],flick:[2000,1200,600,200]};
      var th = thresholds[currentMode];
      var rank = score>=th[0]?'S':score>=th[1]?'A':score>=th[2]?'B':score>=th[3]?'C':'D';

      document.getElementById('result-rank').textContent = rank;
      document.getElementById('result-rank').className = 'rank rank-'+rank;
      document.getElementById('result-score').textContent = score;

      var best = parseInt(localStorage.getItem('tb_best_'+currentMode)||'0');
      var isNew = score > best;
      if (isNew) localStorage.setItem('tb_best_'+currentMode, score);
      document.getElementById('new-record').style.display = isNew ? 'block' : 'none';

      var el = document.getElementById('result-details');
      el.innerHTML = details.map(function(d){
        return '<div class="detail-item"><div class="label">'+d.l+'</div><div class="value">'+d.v+'</div></div>';
      }).join('');

      showScreen('result-screen');
      loadBests();
    }, 700);
  }

  /* ========================================
     EVENT LISTENERS
     ======================================== */
  canvas.addEventListener('mousemove', function(e) {
    var r = canvas.getBoundingClientRect();
    mx = e.clientX - r.left;
    my = e.clientY - r.top;
  });

  canvas.addEventListener('click', function(e) {
    if (!running) return;
    var r = canvas.getBoundingClientRect();
    modes[currentMode].click(e.clientX - r.left, e.clientY - r.top);
  });

  document.getElementById('mode-grid').addEventListener('click', function(e) {
    var card = e.target.closest('.mode-card');
    if (card && card.dataset.mode) startGame(card.dataset.mode);
  });

  document.getElementById('back-btn').addEventListener('click', function() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    document.getElementById('countdown-overlay').classList.add('hidden');
    showScreen('menu-screen');
  });

  document.getElementById('retry-btn').addEventListener('click', function() { startGame(currentMode); });
  document.getElementById('menu-btn').addEventListener('click', function() { showScreen('menu-screen'); loadBests(); });
  window.addEventListener('resize', function() { if (document.getElementById('game-screen').classList.contains('active')) resize(); });

  loadBests();
})();
</script>
</body>
</html>
